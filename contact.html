<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Nitin Computers</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header>
        <img src="https://via.placeholder.com/150" alt="Nitin Computers Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <div class="banner">
        <h1>Contact Us</h1>
    </div>
    <section class="contact-section">
        <h2>Get in Touch</h2>
        <form action="#" method="post">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>
        <div class="contact-info">
            <h3>Contact Details</h3>
            <p>Location: Mangalya, Engineering College Road Near Lokmanya General Stores Loni BK, Tal Rahata, Loni Bk., Maharashtra 413736</p>
            <p>Email: info@nitincomputers.com</p>
            <p>Phone: +91 8796287600</p>
        </div>
    </section>
    <footer>
        <div class="social-icons">
            <a href="#"><img src="assets/images/facebook.png" alt="Facebook"></a>
            <a href="#"><img src="assets/images/Instagram.png" alt="Instagram"></a>
            <a href="#"><img src="assets/images/whatsapp.png" alt="WhatsApp"></a>
        </div>
        <div class="copyright">
            <p>© 2025 Nitin Computers. All Rights Reserved.</p>
        </div>
    </footer>
    <script src="assets/js/scripts.js"></script>
</body>
</html>
