<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Nitin Computers</title>
    <style>
        /* General Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            color: #333;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #6c63ff;
            padding: 10px 20px;
            color: white;
        }
        nav {
            display: flex;
            gap: 15px;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #ffdd57;
        }
        .contact-container {
            max-width: 800px;
            margin: 30px auto;
            text-align: left;
        }
        .contact-container h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .contact-form {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .contact-form button {
            display: block;
            width: 100%;
            padding: 10px;
            background: #6c63ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .contact-form button:hover {
            background: #4b46c2;
        }
        .contact-details {
            margin: 20px 0;
        }
        .contact-details p {
            margin-bottom: 10px;
        }
        iframe {
            width: 100%;
            height: 300px;
            border: none;
            margin-top: 20px;
        }
        footer {
            background: #333;
            color: white;
            padding: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <div class="contact-container">
        <h1>Contact Us</h1>
        <div class="contact-details">
            <p><strong>Address:</strong> Mangalya, Engineering College Road Near Lokmanya General Stores Loni BK, Tal Rahata, Loni Bk., Maharashtra 413736</p>
            <p><strong>Email:</strong> info@nitincomputers.com</p>
            <p><strong>Phone:</strong> +91 8796287600</p>
        </div>
        <!-- Contact Form -->
        <div class="contact-form">
            <form action="#">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <input type="tel" name="phone" placeholder="Your Phone Number">
                <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
        <!-- Google Maps Integration -->
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d234.94708293703863!2d74.45078353758724!3d19.57793078996621!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bdcf72d9fb73d27%3A0x23ceeedf97f4d56a!2sMangalya%20Shopping%20Complex!5e0!3m2!1sen!2sin!4v1744616765959!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
    <footer>
        <p>© 2025 Nitin Computers. All Rights Reserved.</p>
    </footer>
</body>
</html>
